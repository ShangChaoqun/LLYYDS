name: Keep Supabase Alive

on:
  schedule:
    # 每3天执行一次（免费计划7天不活跃会暂停，3天足够安全）
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_URL or SUPABASE_ANON_KEY not set in GitHub Secrets"
            exit 1
          fi

          echo "Pinging Supabase to keep project alive..."

          STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/room_data?select=collection&limit=1")

          echo "HTTP Status: $STATUS"
          echo "Response:"
          cat /tmp/response.txt

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Supabase project is alive"
          else
            echo "⚠️ Unexpected status code, project may be paused. Check dashboard."
          fi
